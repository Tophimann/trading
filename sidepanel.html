<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SubSphere Side Panel</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body class="sidepanel-body">
  <div class="sidepanel-container">
    <!-- Header -->
    <header class="sidepanel-header glass-panel">
      <div class="header-logo">
        <div class="logo-icon animate-pulse-glow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </div>
        <h2>SubSphere</h2>
      </div>
      <a href="dashboard.html" target="_blank" class="dashboard-link btn btn-secondary" title="Open Organizer Dashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
      </a>
    </header>

    <!-- Horizontal Category Scrollbar -->
    <nav class="groups-navigator-container">
      <div class="groups-navigator" id="groups-scroll-list">
        <!-- Loaded dynamically -->
      </div>
    </nav>

    <!-- Main Feed Section -->
    <main class="feed-section">
      <div class="feed-header">
        <h3 id="current-group-title">Select a Group</h3>
        <span class="video-count-badge" id="video-count">0 videos</span>
      </div>

      <!-- Feed Container -->
      <div class="video-feed-container" id="video-feed-list">
        <!-- Loaded dynamically via RSS -->
        <div class="feed-placeholder">
          <span class="placeholder-icon">📺</span>
          <p>Welcome to SubSphere!</p>
          <span class="placeholder-sub">Select a category folder above to load your custom chronological video feed.</span>
        </div>
      </div>
    </main>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
